name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: crewclaro, POSTGRES_PASSWORD: crewclaro, POSTGRES_DB: crewclaro }
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
        env: { DATABASE_URL: "postgresql://crewclaro:crewclaro@localhost:5432/crewclaro" }
      - run: npm test
      - run: npm run build
